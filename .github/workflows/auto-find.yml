name: Auto-Find Candidates

on:
  schedule:
    - cron: "0 0 * * *"          # 每天北京时间 08:00 自动查找
  workflow_dispatch:             # 也可在 Actions 页面手动点击运行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "auto-find"
  cancel-in-progress: true

jobs:
  search-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run search engine
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python3 search/search.py candidates.json

      - name: Commit candidates pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if git diff --cached --quiet; then
            echo "NO_CHANGES=1" >> "$GITHUB_ENV"
          else
            git commit -m "自动查找：更新候选池"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
